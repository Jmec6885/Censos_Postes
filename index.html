<script>
// Colores por tipo de poste
const COLORES = {
  clesa_sin_lampara: "#2b6cb0",
  clesa_con_lampara: "#d69e2e",
  fuera_norma: "#c53030",
  privado: "#6b46c1"
};

const NOMBRES = {
  clesa_sin_lampara: "Sin lampara",
  clesa_con_lampara: "Con lampara",
  fuera_norma: "Fuera de norma",
  privado: "Privado"
};

let coordenadaActual = null;
let capasMarcadores = [];
let posteEnEdicion = null;

// URL de tu Web App de Apps Script
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNlPmxv9D2yDv1Mft__4UgLy4K9swC7FLmFCBCOvdoaTUnNFr_qwd-lZdGJvr5A4s_Ug/exec";

// Mapa inicial centrado en Sonsonate como referencia
const mapa = L.map('mapa', { preferCanvas: true, zoomControl: false }).setView([13.7167, -89.7241], 13);
L.control.zoom({ position: 'bottomleft' }).addTo(mapa);

// ---- Base de datos local (IndexedDB) para guardar las imagenes del mapa ----
let dbOffline = null;

function abrirDBOffline() {
  return new Promise(function(resolve, reject) {
    if (dbOffline) {
      resolve(dbOffline);
      return;
    }
    const peticion = indexedDB.open('mapaOfflineDB', 1);
    peticion.onupgradeneeded = function(e) {
      e.target.result.createObjectStore('tiles');
    };
    peticion.onsuccess = function(e) {
      dbOffline = e.target.result;
      resolve(dbOffline);
    };
    peticion.onerror = function(e) {
      reject(e);
    };
  });
}

function guardarTileDB(clave, blob) {
  return abrirDBOffline().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction('tiles', 'readwrite');
      tx.objectStore('tiles').put(blob, clave);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e); };
    });
  });
}

function obtenerTileDB(clave) {
  return abrirDBOffline().then(function(db) {
    return new Promise(function(resolve) {
      const tx = db.transaction('tiles', 'readonly');
      const peticion = tx.objectStore('tiles').get(clave);
      peticion.onsuccess = function() { resolve(peticion.result || null); };
      peticion.onerror = function() { resolve(null); };
    });
  });
}

// Capa de mapa que primero busca la imagen guardada en el celular, y solo pide internet si no la tiene
const CapaMapaOffline = L.GridLayer.extend({
  createTile: function(coords, done) {
    const tile = document.createElement('img');
    const z = coords.z, x = coords.x, y = coords.y;
    const clave = z + '_' + x + '_' + y;

    obtenerTileDB(clave).then(function(blobGuardado) {
      if (blobGuardado) {
        tile.src = URL.createObjectURL(blobGuardado);
        done(null, tile);
        return;
      }
      if (!navigator.onLine) {
        done(null, tile);
        return;
      }
      const url = 'https://a.tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png';
      fetch(url).then(function(resp) {
        if (!resp.ok) {
          throw new Error('sin tile');
        }
        return resp.blob();
      }).then(function(blobNuevo) {
        tile.src = URL.createObjectURL(blobNuevo);
        done(null, tile);
      }).catch(function() {
        done(null, tile);
      });
    });

    return tile;
  }
});

new CapaMapaOffline({
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(mapa);

// Marcador temporal que aparece justo al capturar una coordenada, para elegir el tipo ahi mismo
let marcadorTemporal = null;

function popupSelectorTipo() {
  let opcionesTipo = "";
  Object.keys(NOMBRES).forEach(function(key) {
    opcionesTipo += "<option value='" + key + "'>" + NOMBRES[key] + "</option>";
  });

  const listaLampara = ["Led", "Fluorescente", "Mercurio", "Reflectores"];
  let opcionesLampara = "";
  listaLampara.forEach(function(o) {
    opcionesLampara += "<option value='" + o + "'>" + o + "</option>";
  });

  const listaPotencia = ["40", "50", "65", "80", "100", "150", "175"];
  let opcionesPotencia = "";
  listaPotencia.forEach(function(o) {
    opcionesPotencia += "<option value='" + o + "'>" + o + "</option>";
  });

  return "<div style='font-size:13px; width:190px;'>" +
    "<strong>Tipo de poste:</strong><br>" +
    "<select id='popupTipo' onchange='elegirTipoDesdeMapa(this.value)' style='margin-top:4px; width:100%;'>" +
    "<option value=''>Selecciona...</option>" + opcionesTipo +
    "</select>" +

    "<div id='popupBloqueLampara' style='display:none; margin-top:6px;'>" +
      "<strong>Tipo de lampara:</strong><br>" +
      "<select id='popupLampara' onchange='cambioLamparaPopup(this.value)' style='width:100%; margin-top:2px;'>" +
      "<option value=''>Selecciona...</option>" + opcionesLampara +
      "<option value='otro'>Otro</option>" +
      "</select>" +
      "<input id='popupLamparaOtro' type='text' placeholder='Escribe el tipo' style='display:none; margin-top:4px; width:100%; box-sizing:border-box;'>" +

      "<strong style='display:block; margin-top:6px;'>Potencia:</strong>" +
      "<select id='popupPotencia' onchange='cambioPotenciaPopup(this.value)' style='width:100%; margin-top:2px;'>" +
      "<option value=''>Selecciona...</option>" + opcionesPotencia +
      "<option value='otro'>Otro</option>" +
      "</select>" +
      "<input id='popupPotenciaOtro' type='text' placeholder='Escribe la potencia' style='display:none; margin-top:4px; width:100%; box-sizing:border-box;'>" +
    "</div>" +

    "<button onclick='guardarPosteRapido()' style='margin-top:8px; background:#2f855a; color:white; border:none; border-radius:4px; padding:6px 10px; font-size:12px; width:100%;'>Guardar</button>" +
    "<button onclick='cancelarMarcadorTemporal()' style='margin-top:6px; background:#c53030; color:white; border:none; border-radius:4px; padding:4px 8px; font-size:12px; width:100%;'>Cancelar este punto</button>" +
    "</div>";
}

function mostrarMarcadorTemporal(lat, lng) {
  if (marcadorTemporal) {
    mapa.removeLayer(marcadorTemporal);
  }
  marcadorTemporal = L.marker([lat, lng], {
    icon: crearIconoGota("#a0aec0")
  }).addTo(mapa).bindPopup(popupSelectorTipo(), { minWidth: 200 });
  marcadorTemporal.openPopup();
}

function elegirTipoDesdeMapa(valor) {
  if (marcadorTemporal) {
    marcadorTemporal.setIcon(crearIconoGota(valor ? COLORES[valor] : "#a0aec0"));
  }
  const bloque = document.getElementById('popupBloqueLampara');
  if (!bloque) {
    return;
  }
  bloque.style.display = (valor && valor !== "clesa_sin_lampara") ? "block" : "none";
}

function cambioLamparaPopup(valor) {
  document.getElementById('popupLamparaOtro').style.display = (valor === "otro") ? "block" : "none";
}

function cambioPotenciaPopup(valor) {
  document.getElementById('popupPotenciaOtro').style.display = (valor === "otro") ? "block" : "none";
}

async function guardarPosteRapido() {
  if (!coordenadaActual) {
    alert("No hay coordenada capturada");
    return;
  }

  const municipio = document.getElementById('municipio').value;
  if (!municipio) {
    alert("Selecciona el municipio arriba antes de guardar");
    return;
  }

  const tipo = document.getElementById('popupTipo').value;
  if (!tipo) {
    alert("Elige el tipo de poste");
    return;
  }

  let tipoLampara = "";
  let potencia = "";

  if (tipo !== "clesa_sin_lampara") {
    const selLampara = document.getElementById('popupLampara').value;
    tipoLampara = (selLampara === "otro") ? document.getElementById('popupLamparaOtro').value.trim() : selLampara;
    if (!tipoLampara) {
      alert("Indica el tipo de lampara");
      return;
    }

    const selPotencia = document.getElementById('popupPotencia').value;
    potencia = (selPotencia === "otro") ? document.getElementById('popupPotenciaOtro').value.trim() : selPotencia;
    if (!potencia) {
      alert("Indica la potencia");
      return;
    }
  }

  const poste = {
    id: Date.now(),
    fecha: new Date().toLocaleDateString(),
    hora: new Date().toLocaleTimeString(),
    municipio: municipio,
    lat: coordenadaActual.lat,
    lng: coordenadaActual.lng,
    manual: coordenadaActual.manual,
    tipo: tipo,
    potencia: potencia,
    tipoLampara: tipoLampara,
    veinticuatroH: false,
    observaciones: "",
    foto: null,
    sincronizado: false
  };

  const postes = obtenerPostes();
  postes.push(poste);
  guardarPostes(postes);
  actualizarEstadoSync();
  actualizarContador();
  dibujarListaPostes();

  quitarMarcadorTemporal();
  coordenadaActual = null;
  document.getElementById('coordActual').innerText = "Coordenada: sin capturar";

  const marcadorNuevo = L.marker([poste.lat, poste.lng], {
    icon: crearIconoGota(COLORES[poste.tipo])
  }).addTo(mapa).bindPopup(contenidoPopup(poste));
  marcadorNuevo.idPoste = poste.id;
  capasMarcadores.push(marcadorNuevo);

  intentarSincronizarAutomatico(poste.id);
}

function cancelarMarcadorTemporal() {
  quitarMarcadorTemporal();
  coordenadaActual = null;
  document.getElementById('coordActual').innerText = "Coordenada: sin capturar";
}

function quitarMarcadorTemporal() {
  if (marcadorTemporal) {
    mapa.removeLayer(marcadorTemporal);
    marcadorTemporal = null;

  }

    detalle += "<br>Obs: " + escaparXml(p.observaciones);

function editarEnGota(id) {
  const postes = obtenerPostes();
  const p = postes.find(function(x) { return x.id === id; });
  if (!p) {
    return;
  }
  const marcador = capasMarcadores.find(function(m) { return m.idPoste === id; });
  if (!marcador) {
    return;
  }
  marcador.setPopupContent(popupEdicionInline(p));
}

function popupEdicionInline(p) {
  let opcionesTipo = "";
  Object.keys(NOMBRES).forEach(function(key) {
    const sel = (key === p.tipo) ? " selected" : "";
    opcionesTipo += "<option value='" + key + "'" + sel + ">" + NOMBRES[key] + "</option>";
  });

  const listaLampara = ["Led", "Fluorescente", "Mercurio", "Reflectores"];
  const esLamparaConocida = listaLampara.indexOf(p.tipoLampara) !== -1;
  let opcionesLampara = "";
  listaLampara.forEach(function(o) {
    const sel = (o === p.tipoLampara) ? " selected" : "";
    opcionesLampara += "<option value='" + o + "'" + sel + ">" + o + "</option>";
  });
  const otroLampara = !!(p.tipoLampara && !esLamparaConocida);

  const listaPotencia = ["40", "50", "65", "80", "100", "150", "175"];
  const esPotenciaConocida = listaPotencia.indexOf(String(p.potencia)) !== -1;
  let opcionesPotencia = "";
  listaPotencia.forEach(function(o) {
    const sel = (o === String(p.potencia)) ? " selected" : "";
    opcionesPotencia += "<option value='" + o + "'" + sel + ">" + o + "</option>";
  });
  const otroPotencia = !!(p.potencia && !esPotenciaConocida);

  const mostrarBloque = p.tipo !== "clesa_sin_lampara";

  return "<div style='font-size:13px; width:190px;'>" +
    "<strong>Editar poste</strong><br>" +
    "<select id='edGotaTipo' onchange='cambioTipoEdicionGota(this.value)' style='margin-top:4px; width:100%;'>" +
    opcionesTipo +
    "</select>" +

    "<div id='edGotaBloqueLampara' style='display:" + (mostrarBloque ? "block" : "none") + "; margin-top:6px;'>" +
      "<strong>Tipo de lampara:</strong><br>" +
      "<select id='edGotaLampara' onchange='cambioLamparaEdicionGota(this.value)' style='width:100%; margin-top:2px;'>" +
      opcionesLampara +
      "<option value='otro'" + (otroLampara ? " selected" : "") + ">Otro</option>" +
      "</select>" +
      "<input id='edGotaLamparaOtro' type='text' placeholder='Escribe el tipo' value='" + (otroLampara ? escaparXml(p.tipoLampara) : "") + "' style='display:" + (otroLampara ? "block" : "none") + "; margin-top:4px; width:100%; box-sizing:border-box;'>" +

      "<strong style='display:block; margin-top:6px;'>Potencia:</strong>" +
      "<select id='edGotaPotencia' onchange='cambioPotenciaEdicionGota(this.value)' style='width:100%; margin-top:2px;'>" +
      opcionesPotencia +
      "<option value='otro'" + (otroPotencia ? " selected" : "") + ">Otro</option>" +
      "</select>" +
      "<input id='edGotaPotenciaOtro' type='text' placeholder='Escribe la potencia' value='" + (otroPotencia ? escaparXml(p.potencia) : "") + "' style='display:" + (otroPotencia ? "block" : "none") + "; margin-top:4px; width:100%; box-sizing:border-box;'>" +
    "</div>" +

    "<button onclick='guardarEdicionGota(" + p.id + ")' style='margin-top:8px; background:#2f855a; color:white; border:none; border-radius:4px; padding:6px 10px; font-size:12px; width:100%;'>Guardar</button>" +
    "<button onclick='cancelarEdicionGota()' style='margin-top:6px; background:#718096; color:white; border:none; border-radius:4px; padding:4px 8px; font-size:12px; width:100%;'>Cancelar</button>" +
    "</div>";

}

function cambioLamparaEdicionGota(valor) {

}

function cambioPotenciaEdicionGota(valor) {

}

function guardarEdicionGota(id) {
  const postes = obtenerPostes();
  const idx = postes.findIndex(function(p) { return p.id === id; });
  if (idx === -1) {
    return;
  }

  const tipo = document.getElementById('edGotaTipo').value;
  let tipoLampara = "";
  let potencia = "";

  if (tipo !== "clesa_sin_lampara") {
    const selLampara = document.getElementById('edGotaLampara').value;
    tipoLampara = (selLampara === "otro") ? document.getElementById('edGotaLamparaOtro').value.trim() : selLampara;
    if (!tipoLampara) {
      alert("Indica el tipo de lampara");
      return;
    }

    const selPotencia = document.getElementById('edGotaPotencia').value;
    potencia = (selPotencia === "otro") ? document.getElementById('edGotaPotenciaOtro').value.trim() : selPotencia;
    if (!potencia) {
      alert("Indica la potencia");
      return;
    }
  }

  postes[idx].tipo = tipo;
  postes[idx].tipoLampara = tipoLampara;
  postes[idx].potencia = potencia;
  postes[idx].sincronizado = false;

  guardarPostes(postes);
  limpiarCapasMarcadores();
  dibujarMarcadores();
  actualizarContador();
  actualizarEstadoSync();
  dibujarListaPostes();

  intentarSincronizarAutomatico(id, true);
}

function cancelarEdicionGota() {
  limpiarCapasMarcadores();
  dibujarMarcadores();
}

function crearIconoGota(color) {

    "<path d='M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z' fill='" + color + "' stroke='#fff' stroke-width='1'/>" +
    "<circle cx='12' cy='12' r='5' fill='#fff'/>" +
    "</svg>";
  return L.divIcon({
    html: svg,
    className: "",
    iconSize: [26, 34],
    iconAnchor: [13, 34],
    popupAnchor: [0, -30]
  });
}

let filtroPotenciaActivo = null;

function claveePotencia(p) {
  const valor = (p.potencia || "").trim();
  return valor === "" ? "Sin dato" : valor;
}

function dibujarMarcadores() {
  let postes = obtenerPostes();
  if (filtroPotenciaActivo) {
    postes = postes.filter(function(p) {
      return p.tipo !== "clesa_sin_lampara" && claveePotencia(p) === filtroPotenciaActivo;
    });
  }
  postes.forEach(function(p) {
    const marcador = L.marker([p.lat, p.lng], {
      icon: crearIconoGota(COLORES[p.tipo])
    }).addTo(mapa).bindPopup(contenidoPopup(p));
    marcador.idPoste = p.id;
    capasMarcadores.push(marcador);
  });
}

function limpiarCapasMarcadores() {
  capasMarcadores.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
  capasMarcadores = [];
}

function actualizarContador() {
  const postes = obtenerPostes();
  const conteo = { clesa_sin_lampara: 0, clesa_con_lampara: 0, fuera_norma: 0, privado: 0 };
  postes.forEach(function(p) { conteo[p.tipo]++; });

  const contenedor = document.getElementById('contador');
  contenedor.innerHTML = "";
  Object.keys(NOMBRES).forEach(function(tipo) {
    const item = document.createElement('div');
    item.className = "contador-item";
    item.innerHTML =
      '<span class="bolita" style="background:' + COLORES[tipo] + '"></span>' +
      NOMBRES[tipo] + ": " + conteo[tipo];
    contenedor.appendChild(item);
  });
}

function leerArchivoComoBase64(archivo) {
  return new Promise(function(resolve, reject) {
    const lector = new FileReader();
    lector.onload = function() { resolve(lector.result); };
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

document.getElementById('btnGuardar').addEventListener('click', async function() {
  if (!coordenadaActual) {
    alert("Primero captura la coordenada del poste");
    return;
  }

  const municipio = document.getElementById('municipio').value;
  if (!municipio) {
    alert("Selecciona el municipio antes de guardar");
    return;
  }

  const tipoSeleccionado = document.getElementById('tipoPoste').value;
  const tipoLampara = document.getElementById('tipoLampara').value.trim();
  const potenciaValor = document.getElementById('potencia').value.trim();
  if (tipoSeleccionado !== "clesa_sin_lampara" && tipoLampara === "") {
    alert("Este tipo de poste lleva lampara, indica el tipo de lampara antes de guardar");
    return;
  }
  if (tipoSeleccionado !== "clesa_sin_lampara" && potenciaValor === "") {
    alert("Este tipo de poste lleva lampara, indica la potencia antes de guardar");
    return;
  }

  const archivoFoto = document.getElementById('foto').files[0];
  let fotoBase64 = null;
  if (archivoFoto) {
    fotoBase64 = await leerArchivoComoBase64(archivoFoto);
  }

  const postes = obtenerPostes();

  if (posteEnEdicion) {
    const indice = postes.findIndex(function(p) { return p.id === posteEnEdicion; });
    if (indice === -1) {
      alert("No se encontro el poste a editar");
      limpiarFormulario();
      return;
    }
    const original = postes[indice];
    postes[indice] = {
      id: original.id,
      fecha: original.fecha,
      hora: original.hora,
      municipio: municipio,
      lat: coordenadaActual.lat,
      lng: coordenadaActual.lng,
      manual: coordenadaActual.manual,
      tipo: tipoSeleccionado,
      potencia: document.getElementById('potencia').value,
      tipoLampara: tipoLampara,
      veinticuatroH: document.getElementById('veinticuatroH').checked,
      observaciones: document.getElementById('observaciones').value,
      foto: fotoBase64 || original.foto,
      sincronizado: false
    };
    guardarPostes(postes);

    limpiarCapasMarcadores();
    dibujarMarcadores();
    actualizarContador();
    actualizarEstadoSync();
    dibujarListaPostes();

    intentarSincronizarAutomatico(original.id, true);

    limpiarFormulario();
    return;
  }

  const poste = {
    id: Date.now(),
    fecha: new Date().toLocaleDateString(),
    hora: new Date().toLocaleTimeString(),
    municipio: municipio,
    lat: coordenadaActual.lat,
    lng: coordenadaActual.lng,
    manual: coordenadaActual.manual,
    tipo: tipoSeleccionado,
    potencia: document.getElementById('potencia').value,
    tipoLampara: tipoLampara,
    veinticuatroH: document.getElementById('veinticuatroH').checked,
    observaciones: document.getElementById('observaciones').value,
    foto: fotoBase64,
    sincronizado: false
  };

  postes.push(poste);
  guardarPostes(postes);
  actualizarEstadoSync();

  intentarSincronizarAutomatico(poste.id);

  const marcadorNuevo = L.marker([poste.lat, poste.lng], {
    icon: crearIconoGota(COLORES[poste.tipo])
  }).addTo(mapa).bindPopup(contenidoPopup(poste));
  marcadorNuevo.idPoste = poste.id;
  capasMarcadores.push(marcadorNuevo);

  actualizarContador();
  limpiarFormulario();
});

function actualizarEstadoSync() {
  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });
  document.getElementById('estadoSync').innerText = "Pendientes por sincronizar: " + pendientes.length;
}

async function enviarPoste(poste) {
  const respuesta = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(poste)
  });
  const texto = await respuesta.text();
  let resultado;
  try {
    resultado = JSON.parse(texto);
  } catch (errorParseo) {
    window.ultimoErrorSync = "Respuesta no es JSON, status " + respuesta.status + ": " + texto.substring(0, 300);
    return false;
  }
  if (!resultado.ok) {
    window.ultimoErrorSync = resultado.error;
  }
  return resultado.ok;
}

async function intentarSincronizarAutomatico(idPoste, mostrarAlerta) {
  if (!navigator.onLine) {
    if (mostrarAlerta) {
      alert("No hay señal en este momento, el cambio queda pendiente de sincronizar.");
    }
    return;
  }

  const postes = obtenerPostes();
  const poste = postes.find(function(p) { return p.id === idPoste; });
  if (!poste || poste.sincronizado) {
    return;
  }

  document.getElementById('estadoSync').innerText = "Enviando poste recien guardado...";

  try {
    const ok = await enviarPoste(poste);
    if (ok) {
      poste.sincronizado = true;
      guardarPostes(postes);
      dibujarListaPostes();
      if (mostrarAlerta) {
        alert("Cambio enviado a la hoja de Sheets correctamente");
      }
    } else if (mostrarAlerta) {
      alert("No se pudo enviar el cambio a la hoja: " + window.ultimoErrorSync);
    }
  } catch (error) {
    console.log("No se pudo sincronizar automaticamente: " + error.message);
    if (mostrarAlerta) {
      alert("No se pudo enviar el cambio a la hoja: " + error.message);
    }
  }

  actualizarEstadoSync();
}

async function sincronizarPendientes(mostrarAlertas) {
  if (!navigator.onLine) {
    if (mostrarAlertas) {
      alert("No hay conexion en este momento, intenta cuando tengas senal");
    }
    return;
  }

  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });

  if (pendientes.length === 0) {
    if (mostrarAlertas) {
      alert("No hay postes pendientes por sincronizar");
    }
    return;
  }

  const boton = document.getElementById('btnSincronizar');
  boton.innerText = "Sincronizando...";
  boton.disabled = true;

  let enviados = 0;

  for (const poste of pendientes) {
    try {
      const ok = await enviarPoste(poste);
      if (ok) {
        poste.sincronizado = true;
        enviados++;
      }
    } catch (error) {
      window.ultimoErrorSync = "Fallo de red: " + error.message;
      console.log("Error enviando poste " + poste.id, error);
    }
  }

  guardarPostes(postes);
  actualizarEstadoSync();
  dibujarListaPostes();

  boton.innerText = "Sincronizar";
  boton.disabled = false;

  if (mostrarAlertas) {
    if (enviados < pendientes.length) {
      alert(enviados + " de " + pendientes.length + " postes sincronizados. Error: " + window.ultimoErrorSync);
    } else {
      alert(enviados + " de " + pendientes.length + " postes sincronizados");
    }
  }
}

document.getElementById('btnSincronizar').addEventListener('click', function() {
  sincronizarPendientes(true);
});

// Cuando el celular recupera senal, manda automaticamente todo lo pendiente
window.addEventListener('online', function() {
  sincronizarPendientes(false);
});

document.getElementById('btnNuevoMunicipio').addEventListener('click', function() {
  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });

  if (pendientes.length > 0) {
    const continuar = confirm(
      "Tienes " + pendientes.length + " poste(s) sin sincronizar. " +
      "Se recomienda sincronizar antes de continuar. " +
      "Si continuas, esos postes sin sincronizar se mantienen guardados, solo se limpia el mapa. Continuar?"
    );
    if (!continuar) {
      return;
    }
  } else {
    const confirmar = confirm("Esto limpia el mapa y el contador para empezar un municipio nuevo. Continuar?");
    if (!confirmar) {
      return;
    }
  }

  const soloPendientes = postes.filter(function(p) { return !p.sincronizado; });
  guardarPostes(soloPendientes);

  limpiarCapasMarcadores();
  dibujarMarcadores();
  actualizarContador();
  actualizarEstadoSync();
  dibujarListaPostes();

  document.getElementById('municipio').value = "";

  alert("Mapa y contador limpios. Tu hoja de Google Sheets no fue modificada.");
});

document.getElementById('btnVerLista').addEventListener('click', function() {
  const contenedor = document.getElementById('listaPostes');
  if (contenedor.style.display === "none") {
    dibujarListaPostes();
    contenedor.style.display = "block";
    this.innerText = "Ocultar postes guardados";
  } else {
    contenedor.style.display = "none";
    this.innerText = "Ver postes guardados";
  }
});

function dibujarListaPostes() {
  const postes = obtenerPostes();
  const contenedor = document.getElementById('listaPostes');
  contenedor.innerHTML = "";

  if (postes.length === 0) {
    contenedor.innerHTML = "<div style='font-size:13px; color:#666;'>No hay postes guardados todavia</div>";
    return;
  }

  postes.slice().reverse().forEach(function(p) {
    const tarjeta = document.createElement('div');
    tarjeta.className = "tarjetaPoste";
    tarjeta.style.borderLeftColor = COLORES[p.tipo];
    tarjeta.innerHTML =
      "<div class='fila'>" +
        "<div>" +
          "<strong>" + NOMBRES[p.tipo] + "</strong><br>" +
          (p.municipio || "Sin municipio") + " - " + p.fecha + " " + p.hora + "<br>" +
          (p.sincronizado ? "Sincronizado" : "Pendiente") +
        "</div>" +
        "<div class='botones'>" +
          "<button class='btnEditarPoste' data-id='" + p.id + "'>Editar</button>" +
          "<button class='btnBorrarPoste' data-id='" + p.id + "'>Borrar</button>" +
        "</div>" +
      "</div>";
    contenedor.appendChild(tarjeta);
  });

  contenedor.querySelectorAll('.btnBorrarPoste').forEach(function(boton) {
    boton.addEventListener('click', function() {
      borrarPoste(Number(this.getAttribute('data-id')));
    });
  });

  contenedor.querySelectorAll('.btnEditarPoste').forEach(function(boton) {
    boton.addEventListener('click', function() {
      editarPosteDesdeMapa(Number(this.getAttribute('data-id')));
    });
  });
}

async function borrarPoste(id) {
  const postes = obtenerPostes();
  const poste = postes.find(function(p) { return p.id === id; });
  if (!poste) {
    return;
  }

  const confirmar = confirm("Seguro que quieres borrar este poste? Esta accion no se puede deshacer.");
  if (!confirmar) {
    return;
  }

  if (poste.sincronizado) {
    if (!navigator.onLine) {
      alert("Este poste ya esta en tu hoja de Sheets. Necesitas señal para borrarlo tambien alla.");
      return;
    }
    try {
      const respuesta = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ accion: "borrar", id: poste.id })
      });
      const texto = await respuesta.text();
      const resultado = JSON.parse(texto);
      if (!resultado.ok) {
        alert("No se pudo borrar en la hoja: " + resultado.error);
        return;
      }
      if (!resultado.borrado) {
        alert("Aviso: en tu celular se borro, pero la hoja no encontro ese ID (" + resultado.idBuscado + "). Revisa la hoja manualmente.");
      } else {
        alert("Borrado tambien en la hoja de Sheets");
      }
    } catch (error) {
      alert("No se pudo borrar en la hoja: " + error.message);
      return;
    }
  }

  const restantes = postes.filter(function(p) { return p.id !== id; });
  guardarPostes(restantes);

  limpiarCapasMarcadores();
  dibujarMarcadores();
  actualizarContador();
  actualizarEstadoSync();
  dibujarListaPostes();
}

// ---- Guia KML de referencia (no se guarda, solo se muestra) ----
let capasGuiaKml = [];
let kmlVisible = false;

function colorPorNombreKml(nombre) {
  const texto = (nombre || "").toLowerCase();
  if (texto.indexOf("privado") !== -1) {
    return "#c53030";
  }
  if (texto.indexOf("alcald") !== -1) {
    return "#d69e2e";
  }
  if (texto.indexOf("aes") !== -1) {
    return "#2f855a";
  }
  return "#4a5568";
}

function armarPopupKml(placemark, nombre) {
  let html = "<div style='font-size:13px; max-width:220px;'><strong>" + nombre + "</strong><br>";

  const tagsDescripcion = placemark.getElementsByTagName("description");
  if (tagsDescripcion.length > 0 && tagsDescripcion[0].textContent.trim() !== "") {
    html += "<div style='margin-top:4px;'>" + tagsDescripcion[0].textContent.trim().replace(/\n/g, "<br>") + "</div>";
  }

  const datosExtendidos = placemark.getElementsByTagName("Data");
  if (datosExtendidos.length > 0) {
    html += "<table style='margin-top:4px; font-size:12px;'>";
    for (let d = 0; d < datosExtendidos.length; d++) {
      const nombreDato = datosExtendidos[d].getAttribute("name") || "";
      const valores = datosExtendidos[d].getElementsByTagName("value");
      const valorDato = valores.length > 0 ? valores[0].textContent.trim() : "";
      if (nombreDato && valorDato) {
        html += "<tr><td style='padding-right:6px; color:#666;'>" + nombreDato + "</td><td>" + valorDato + "</td></tr>";
      }
    }
    html += "</table>";
  }

  html += "</div>";
  return html;
}

document.getElementById('archivoKml').addEventListener('change', async function() {
  const archivo = this.files[0];
  if (!archivo) {
    return;
  }

  document.getElementById('estadoKml').innerText = "Leyendo archivo KML...";

  const texto = await archivo.text();
  const parser = new DOMParser();
  const xml = parser.parseFromString(texto, "application/xml");
  const placemarks = xml.getElementsByTagName("Placemark");

  limpiarCapasKml();

  let cargados = 0;
  for (let i = 0; i < placemarks.length; i++) {
    const puntos = placemarks[i].getElementsByTagName("coordinates");
    if (puntos.length === 0) {
      continue;
    }
    const texto = puntos[0].textContent.trim();
    const partes = texto.split(",");
    const lon = parseFloat(partes[0]);
    const lat = parseFloat(partes[1]);
    if (isNaN(lat) || isNaN(lon)) {
      continue;
    }

    const tagsNombre = placemarks[i].getElementsByTagName("name");
    const nombre = tagsNombre.length > 0 ? tagsNombre[0].textContent.trim() : "Punto de guia";
    const color = colorPorNombreKml(nombre);

    const contenidoPopupKml = armarPopupKml(placemarks[i], nombre);

    const marcador = L.circleMarker([lat, lon], {
      radius: 6,
      color: "#000",
      fillColor: color,
      weight: 1,
      fillOpacity: 0.85
    }).bindPopup(contenidoPopupKml)
      .bindTooltip(nombre, { permanent: true, direction: "top", offset: [0, -4], className: "etiquetaKml" });
    capasGuiaKml.push(marcador);
    cargados++;
  }

  document.getElementById('estadoKml').innerText = cargados + " puntos de guia cargados. Usa el boton para mostrarlos u ocultarlos.";

  if (!kmlVisible) {
    kmlVisible = true;
    document.getElementById('btnToggleKml').innerText = "Ocultar guia KML";
    mostrarCapasKml();
  }
});

function mostrarCapasKml() {
  capasGuiaKml.forEach(function(marcador) {
    marcador.addTo(mapa);
  });
}

function limpiarCapasKml() {
  capasGuiaKml.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
  capasGuiaKml = [];
}

document.getElementById('btnToggleKml').addEventListener('click', function() {
  if (capasGuiaKml.length === 0) {
    alert("Primero carga un archivo KML");
    return;
  }
  if (kmlVisible) {
    limpiarCapasKmlSoloMapa();
    kmlVisible = false;
    this.innerText = "Mostrar guia KML";
  } else {
    mostrarCapasKml();
    kmlVisible = true;
    this.innerText = "Ocultar guia KML";
  }
});

function limpiarCapasKmlSoloMapa() {
  capasGuiaKml.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
}

// ---- Exportar los postes censados como KML ----
function escaparXml(texto) {
  if (texto === null || texto === undefined) {
    return "";
  }
  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

document.getElementById('btnExportarKml').addEventListener('click', function() {
  const postes = obtenerPostes();

  if (postes.length === 0) {
    alert("No hay postes guardados para exportar");
    return;
  }

  let placemarks = "";
  postes.forEach(function(p) {
    const descripcion =
      "Municipio: " + escaparXml(p.municipio) + "\n" +
      "Tipo: " + escaparXml(NOMBRES[p.tipo]) + "\n" +
      "Tipo de lampara: " + escaparXml(p.tipoLampara) + "\n" +
      "Potencia: " + escaparXml(p.potencia) + "\n" +
      "24H: " + (p.veinticuatroH ? "Si" : "No") + "\n" +
      "Observaciones: " + escaparXml(p.observaciones) + "\n" +
      "Fecha: " + escaparXml(p.fecha) + " " + escaparXml(p.hora) + "\n" +
      "Sincronizado: " + (p.sincronizado ? "Si" : "No");

    placemarks +=
      "<Placemark>" +
      "<name>" + escaparXml(NOMBRES[p.tipo]) + "</name>" +
      "<description><![CDATA[" + descripcion + "]]></description>" +
      "<Point><coordinates>" + p.lng + "," + p.lat + ",0</coordinates></Point>" +
      "</Placemark>";
  });

  const kml =
    '<?xml version="1.0" encoding="UTF-8"?>' +
    '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>' +
    "<name>Censo de Postes</name>" +
    placemarks +
    "</Document></kml>";

  const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement('a');
  enlace.href = url;
  const fecha = new Date().toISOString().slice(0, 10);
  enlace.download = "censo_postes_" + fecha + ".kml";
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  URL.revokeObjectURL(url);
});

// ---- Descargar el mapa de la zona visible para usarlo sin señal ----
function long2tile(lon, zoom) {
  return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
}

function lat2tile(lat, zoom) {
  return Math.floor(
    (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom)
  );
}

document.getElementById('btnDescargarMapa').addEventListener('click', async function() {
  if (!navigator.onLine) {
    alert("Necesitas señal para descargar el mapa de esta zona");
    return;
  }

  const bounds = mapa.getBounds();
  const zooms = [14, 15, 16, 17];
  const listaTiles = [];

  zooms.forEach(function(z) {
    const x1 = long2tile(bounds.getWest(), z);
    const x2 = long2tile(bounds.getEast(), z);
    const y1 = lat2tile(bounds.getNorth(), z);
    const y2 = lat2tile(bounds.getSouth(), z);
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
        listaTiles.push({ z: z, x: x, y: y });
      }
    }
  });

  if (listaTiles.length > 4000) {
    const continuar = confirm(
      "Esta zona tiene " + listaTiles.length + " imagenes de mapa, puede tardar varios minutos y pesar bastante. " +
      "Si es mucha area, acerca mas el zoom antes de descargar. Continuar de todas formas?"
    );
    if (!continuar) {
      return;
    }
  }

  const boton = document.getElementById('btnDescargarMapa');
  boton.disabled = true;
  let hechos = 0;
  let nuevos = 0;

  for (const t of listaTiles) {
    const clave = t.z + '_' + t.x + '_' + t.y;
    const existente = await obtenerTileDB(clave);
    if (!existente) {
      try {
        const url = 'https://a.tile.openstreetmap.org/' + t.z + '/' + t.x + '/' + t.y + '.png';
        const resp = await fetch(url);
        if (resp.ok) {
          const blob = await resp.blob();
          await guardarTileDB(clave, blob);
          nuevos++;
        }
      } catch (error) {
        console.log("No se pudo descargar tile " + clave);
      }
    }
    hechos++;
    if (hechos % 15 === 0 || hechos === listaTiles.length) {
      document.getElementById('estadoMapaOffline').innerText =
        "Descargando: " + hechos + " de " + listaTiles.length;
    }
  }

  document.getElementById('estadoMapaOffline').innerText =
    "Listo. " + nuevos + " imagenes nuevas guardadas (" + listaTiles.length + " revisadas en total). Ya puedes usar esta zona sin señal.";
  boton.disabled = false;
});

// ---- Conteo de lamparas por potencia, tocable para filtrar el mapa ----
document.getElementById('btnPotencias').addEventListener('click', function() {
  const panel = document.getElementById('panelPotencias');
  if (panel.style.display === "block") {
    panel.style.display = "none";
    return;
  }

  const postes = obtenerPostes();
  const conteo = {};
  postes.forEach(function(p) {
    if (p.tipo === "clesa_sin_lampara") {
      return;
    }
    const clave = claveePotencia(p);
    conteo[clave] = (conteo[clave] || 0) + 1;
  });

  const claves = Object.keys(conteo).sort(function(a, b) {
    const na = parseFloat(a), nb = parseFloat(b);
    if (isNaN(na) || isNaN(nb)) {
      return a.localeCompare(b);
    }
    return na - nb;
  });

  if (claves.length === 0) {
    panel.innerHTML = "<strong>Lamparas por potencia</strong><br>Sin postes con lampara todavia";
  } else {
    let html = "<strong>Lamparas por potencia</strong><div style='font-size:10px; color:#888; margin-top:2px;'>Toca una para verla en el mapa</div>";
    claves.forEach(function(clave) {
      const activa = filtroPotenciaActivo === clave;
      html += "<div onclick='filtrarPorPotenciaClick(\"" + clave + "\")' style='display:flex; justify-content:space-between; margin-top:6px; padding:4px 6px; border-radius:4px; cursor:pointer; background:" + (activa ? "#ebf8ff" : "transparent") + "; font-weight:" + (activa ? "bold" : "normal") + ";'>" +
        "<span>" + clave + (activa ? " (viendo)" : "") + "</span><span style='margin-left:10px;'>" + conteo[clave] + "</span></div>";
    });
    if (filtroPotenciaActivo) {
      html += "<div onclick='filtrarPorPotenciaClick(null)' style='margin-top:8px; text-align:center; color:#c53030; font-size:11px; cursor:pointer;'>Quitar filtro</div>";
    }
    panel.innerHTML = html;
  }

  panel.style.display = "block";
});

function filtrarPorPotenciaClick(clave) {
  filtroPotenciaActivo = (filtroPotenciaActivo === clave) ? null : clave;
  limpiarCapasMarcadores();
  dibujarMarcadores();
  document.getElementById('panelPotencias').style.display = "none";
}

// ---- Totales por dia, con filtro de municipio y seleccion de una o varias fechas ----
let datosTotalesCache = [];
let porDiaTotalesActual = {};

document.getElementById('btnTotalesPorDia').addEventListener('click', async function() {
  const bloque = document.getElementById('bloqueTotalesPorDia');

  if (bloque.style.display === "block") {
    bloque.style.display = "none";
    this.innerText = "Ver totales por dia (Sheets)";
    return;
  }

  if (!navigator.onLine) {
    alert("Necesitas señal para consultar los totales de la hoja");
    return;
  }

  this.innerText = "Consultando...";

  try {
    const respuesta = await fetch(APPS_SCRIPT_URL);
    const datos = await respuesta.json();

    if (!datos.ok) {
      alert("No se pudo consultar: " + datos.error);
      this.innerText = "Ver totales por dia (Sheets)";
      return;
    }

    datosTotalesCache = datos.postes;
    renderizarFiltroMunicipioTotales();
    renderizarFechasTotales();

    bloque.style.display = "block";
    this.innerText = "Ocultar totales por dia";
  } catch (error) {
    alert("Error al consultar: " + error.message);
    this.innerText = "Ver totales por dia (Sheets)";
  }
});

function renderizarFiltroMunicipioTotales() {
  const municipios = Array.from(new Set(datosTotalesCache.map(function(p) { return p.municipio; }).filter(Boolean))).sort();
  let html = "<option value=''>Todos los municipios</option>";
  municipios.forEach(function(m) {
    html += "<option value='" + m + "'>" + m + "</option>";
  });
  document.getElementById('filtroMunicipioTotales').innerHTML = html;
}

document.getElementById('filtroMunicipioTotales').addEventListener('change', renderizarFechasTotales);

function renderizarFechasTotales() {
  const municipioSel = document.getElementById('filtroMunicipioTotales').value;
  const filtrados = datosTotalesCache.filter(function(p) {
    return !municipioSel || p.municipio === municipioSel;
  });

  porDiaTotalesActual = {};
  filtrados.forEach(function(p) {
    const fecha = p.fecha || "Sin fecha";
    if (!porDiaTotalesActual[fecha]) {
      porDiaTotalesActual[fecha] = { total: 0, tipos: {}, potencias: {} };
    }
    porDiaTotalesActual[fecha].total++;
    const nombreTipo = NOMBRES[p.tipo] || p.tipo;
    porDiaTotalesActual[fecha].tipos[nombreTipo] = (porDiaTotalesActual[fecha].tipos[nombreTipo] || 0) + 1;
    if (p.tipo !== "clesa_sin_lampara") {
      const claveP = (p.potencia || "").toString().trim() || "Sin dato";
      porDiaTotalesActual[fecha].potencias[claveP] = (porDiaTotalesActual[fecha].potencias[claveP] || 0) + 1;
    }
  });

  const fechas = Object.keys(porDiaTotalesActual).sort().reverse();
  const contenedor = document.getElementById('listaFechasTotales');

  if (fechas.length === 0) {
    contenedor.innerHTML = "Sin postes para este municipio";
  } else {
    let html = "";
    fechas.forEach(function(fecha) {
      const info = porDiaTotalesActual[fecha];
      html += "<label class='tarjetaPoste' style='display:block; border-left-color:#2b6cb0;'>" +
        "<input type='checkbox' class='chkFechaTotales' value='" + fecha + "' onchange='recalcularSeleccionTotales()'> " +
        "<strong>" + fecha + "</strong> — " + info.total + " postes<br>";
      Object.keys(info.tipos).forEach(function(tipoNombre) {
        html += "<span style='font-size:12px; color:#4a5568;'>" + tipoNombre + ": " + info.tipos[tipoNombre] + "</span><br>";
      });
      html += "</label>";
    });
    contenedor.innerHTML = html;
  }

  recalcularSeleccionTotales();
}

function recalcularSeleccionTotales() {
  const checks = document.querySelectorAll('.chkFechaTotales:checked');
  const resumen = document.getElementById('resumenSeleccionTotales');

  if (checks.length === 0) {
    resumen.innerHTML = "<span style='color:#666;'>Marca una o varias fechas para ver el total combinado</span>";
    return;
  }

  let totalGeneral = 0;
  const tiposComb = {};
  const potenciasComb = {};

  checks.forEach(function(chk) {
    const info = porDiaTotalesActual[chk.value];
    if (!info) {
      return;
    }
    totalGeneral += info.total;
    Object.keys(info.tipos).forEach(function(t) {
      tiposComb[t] = (tiposComb[t] || 0) + info.tipos[t];
    });
    Object.keys(info.potencias).forEach(function(p) {
      potenciasComb[p] = (potenciasComb[p] || 0) + info.potencias[p];
    });
  });

  let html = "<strong>Total combinado: " + totalGeneral + " postes</strong><br>";
  Object.keys(tiposComb).forEach(function(t) {
    html += t + ": " + tiposComb[t] + "<br>";
  });

  const clavesPotencia = Object.keys(potenciasComb);
  if (clavesPotencia.length > 0) {
    html += "<div style='margin-top:6px; font-weight:bold;'>Por potencia:</div>";
    clavesPotencia.sort(function(a, b) {
      const na = parseFloat(a), nb = parseFloat(b);
      return (isNaN(na) || isNaN(nb)) ? a.localeCompare(b) : na - nb;
    }).forEach(function(p) {
      html += p + ": " + potenciasComb[p] + "<br>";
    });
  }

  resumen.innerHTML = html;
}
