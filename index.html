<style>

    font-family: Arial, sans-serif;

    background: #f4f4f4;

    height: 45vh;

    display: flex;

    margin-bottom: 12px;

    flex-wrap: wrap;

    display: flex;

  }
  .bolita {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
    font-size: 14px;
  }
  select, textarea, input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
    font-size: 14px;
  }
  #btnGps {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
  }
  #btnGuardar {
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    background: #2f855a;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
  }
  #coordActual {
    margin-top: 8px;
    font-size: 13px;
    color: #444;
  }
  .tarjetaPoste {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    font-size: 13px;
    border-left: 5px solid #ccc;
  }
  .tarjetaPoste .fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tarjetaPoste .botones {
    display: flex;
    gap: 6px;
  }
  .btnBorrarPoste {
    background: #c53030;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .btnEditarPoste {
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .popupBotones button {
    margin-top: 4px;
    margin-right: 4px;
    padding: 4px 8px;
    font-size: 12px;
    border: none;
    border-radius: 4px;
    color: white;
  }
</style>
</head>
<body>

<div id="mapa"></div>

<div id="panel">

  <div id="contador"></div>

  <div id="coordActual">Coordenada: sin capturar</div>

  <label style="margin-top:18px;">Mapa sin señal</label>
  <div style="font-size:12px; color:#666; margin-top:2px;">Navega y haz zoom hasta la zona donde vas a trabajar, luego descarga.</div>
  <button id="btnDescargarMapa" style="margin-top:8px; width:100%; padding:12px; background:#2c5282; color:white; border:none; border-radius:6px; font-size:15px;">Descargar mapa de esta zona</button>
  <div id="estadoMapaOffline" style="margin-top:8px; font-size:13px; color:#444;"></div>

      <option value="Juayua">Juayua</option>
      <option value="Nahuizalco">Nahuizalco</option>
      <option value="Nahulingo">Nahulingo</option>
      <option value="Salcoatitan">Salcoatitan</option>
      <option value="San Antonio del Monte">San Antonio del Monte</option>
      <option value="San Julian">San Julian</option>
      <option value="Santa Catarina Masahuat">Santa Catarina Masahuat</option>
      <option value="Santa Isabel Ishuatan">Santa Isabel Ishuatan</option>
      <option value="Santo Domingo de Guzman">Santo Domingo de Guzman</option>
      <option value="Sonsonate">Sonsonate</option>
      <option value="Sonzacate">Sonzacate</option>
    </optgroup>
    <optgroup label="Ahuachapan">
      <option value="Ahuachapan">Ahuachapan</option>
      <option value="Apaneca">Apaneca</option>
      <option value="Atiquizaya">Atiquizaya</option>
      <option value="Concepcion de Ataco">Concepcion de Ataco</option>
      <option value="El Refugio">El Refugio</option>
      <option value="Guaymango">Guaymango</option>
      <option value="Jujutla">Jujutla</option>
      <option value="San Francisco Menendez">San Francisco Menendez</option>
      <option value="San Lorenzo">San Lorenzo</option>
      <option value="San Pedro Puxtla">San Pedro Puxtla</option>
      <option value="Tacuba">Tacuba</option>
      <option value="Turin">Turin</option>
    </optgroup>
    <optgroup label="Santa Ana">
      <option value="Candelaria de la Frontera">Candelaria de la Frontera</option>
      <option value="Chalchuapa">Chalchuapa</option>
      <option value="Coatepeque">Coatepeque</option>
      <option value="El Congo">El Congo</option>
      <option value="El Porvenir">El Porvenir</option>

      <option value="Metapan">Metapan</option>

  <label>Tipo de poste</label>

  <div id="estadoSync" style="margin-top:14px; font-size:13px; color:#444;">Pendientes por sincronizar: 0</div>

  <button id="btnNuevoMunicipio" style="margin-top:8px; width:100%; padding:12px; background:#744210; color:white; border:none; border-radius:6px; font-size:15px;">Nuevo municipio (limpiar mapa)</button>

  <button id="btnVerLista" style="margin-top:8px; width:100%; padding:12px; background:#4a5568; color:white; border:none; border-radius:6px; font-size:15px;">Ver postes guardados</button>

  <div id="listaPostes" style="display:none; margin-top:10px;"></div>

  <label style="margin-top:18px;">Guia KML (solo referencia, no se guarda)</label>
  <input type="file" id="archivoKml" accept=".kml">
  <button id="btnToggleKml" style="margin-top:8px; width:100%; padding:12px; background:#555; color:white; border:none; border-radius:6px; font-size:15px;">Mostrar guia KML</button>
  <div id="estadoKml" style="margin-top:8px; font-size:13px; color:#444;"></div>

  <label style="margin-top:18px;">Exportar tus postes censados</label>
  <button id="btnExportarKml" style="margin-top:8px; width:100%; padding:12px; background:#1a7f5a; color:white; border:none; border-radius:6px; font-size:15px;">Exportar KML de mis postes</button>

</div>

<script>
// Colores por tipo de poste
const COLORES = {
  clesa_sin_lampara: "#2b6cb0",
  clesa_con_lampara: "#d69e2e",
  fuera_norma: "#c53030",
  privado: "#6b46c1"
};

const NOMBRES = {
  clesa_sin_lampara: "Sin lampara",
  clesa_con_lampara: "Con lampara",
  fuera_norma: "Fuera de norma",
  privado: "Privado"
};

let coordenadaActual = null;
let capasMarcadores = [];
let posteEnEdicion = null;

// URL de tu Web App de Apps Script
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNlPmxv9D2yDv1Mft__4UgLy4K9swC7FLmFCBCOvdoaTUnNFr_qwd-lZdGJvr5A4s_Ug/exec";

// Mapa inicial centrado en Sonsonate como referencia
const mapa = L.map('mapa', { preferCanvas: true }).setView([13.7167, -89.7241], 13);

// ---- Base de datos local (IndexedDB) para guardar las imagenes del mapa ----
let dbOffline = null;

function abrirDBOffline() {
  return new Promise(function(resolve, reject) {
    if (dbOffline) {
      resolve(dbOffline);
      return;
    }
    const peticion = indexedDB.open('mapaOfflineDB', 1);
    peticion.onupgradeneeded = function(e) {
      e.target.result.createObjectStore('tiles');
    };
    peticion.onsuccess = function(e) {
      dbOffline = e.target.result;
      resolve(dbOffline);
    };
    peticion.onerror = function(e) {
      reject(e);
    };
  });
}

function guardarTileDB(clave, blob) {
  return abrirDBOffline().then(function(db) {
    return new Promise(function(resolve, reject) {
      const tx = db.transaction('tiles', 'readwrite');
      tx.objectStore('tiles').put(blob, clave);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e); };
    });
  });
}

function obtenerTileDB(clave) {
  return abrirDBOffline().then(function(db) {
    return new Promise(function(resolve) {
      const tx = db.transaction('tiles', 'readonly');
      const peticion = tx.objectStore('tiles').get(clave);
      peticion.onsuccess = function() { resolve(peticion.result || null); };
      peticion.onerror = function() { resolve(null); };
    });
  });
}

// Capa de mapa que primero busca la imagen guardada en el celular, y solo pide internet si no la tiene
const CapaMapaOffline = L.GridLayer.extend({
  createTile: function(coords, done) {
    const tile = document.createElement('img');
    const z = coords.z, x = coords.x, y = coords.y;
    const clave = z + '_' + x + '_' + y;

    obtenerTileDB(clave).then(function(blobGuardado) {
      if (blobGuardado) {
        tile.src = URL.createObjectURL(blobGuardado);
        done(null, tile);
        return;
      }
      if (!navigator.onLine) {
        done(null, tile);
        return;
      }
      const url = 'https://a.tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png';
      fetch(url).then(function(resp) {
        if (!resp.ok) {
          throw new Error('sin tile');
        }
        return resp.blob();
      }).then(function(blobNuevo) {
        tile.src = URL.createObjectURL(blobNuevo);
        done(null, tile);
      }).catch(function() {
        done(null, tile);
      });
    });

    return tile;
  }
});

new CapaMapaOffline({
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(mapa);

// Permite tocar el mapa para ubicacion manual
mapa.on('click', function(e) {
  coordenadaActual = { lat: e.latlng.lat, lng: e.latlng.lng, manual: true };
  document.getElementById('coordActual').innerText =
    "Coordenada (manual): " + coordenadaActual.lat.toFixed(6) + ", " + coordenadaActual.lng.toFixed(6);
});

document.getElementById('btnGps').addEventListener('click', function() {
  if (!navigator.geolocation) {
    alert("Este dispositivo no tiene GPS disponible");
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos) {
    coordenadaActual = { lat: pos.coords.latitude, lng: pos.coords.longitude, manual: false };
    document.getElementById('coordActual').innerText =
      "Coordenada (GPS): " + coordenadaActual.lat.toFixed(6) + ", " + coordenadaActual.lng.toFixed(6);
    mapa.setView([coordenadaActual.lat, coordenadaActual.lng], 17);
  }, function(err) {
    alert("No se pudo obtener la coordenada: " + err.message);
  }, { enableHighAccuracy: true });
});

// Muestra u oculta el campo de potencia segun el tipo
document.getElementById('tipoPoste').addEventListener('change', function() {
  const tipo = this.value;
  document.getElementById('bloquePotencia').style.display =
    (tipo === "clesa_con_lampara" || tipo === "fuera_norma" || tipo === "privado") ? "block" : "none";
});

function obtenerPostes() {
  const datos = localStorage.getItem('postesCenso');
  return datos ? JSON.parse(datos) : [];
}

function guardarPostes(lista) {
  localStorage.setItem('postesCenso', JSON.stringify(lista));
}

function contenidoPopup(p) {
  return "<div class='popupBotones'>" +
    "<strong>" + NOMBRES[p.tipo] + "</strong><br>" +
    (p.municipio || "") +
    "<br><button style='background:#2b6cb0;' onclick='editarPosteDesdeMapa(" + p.id + ")'>Editar</button>" +
    "<button style='background:#c53030;' onclick='borrarPoste(" + p.id + ")'>Eliminar</button>" +
    "</div>";
}

function crearIconoGota(color) {
  const svg =
    "<svg width='26' height='34' viewBox='0 0 24 32' xmlns='http://www.w3.org/2000/svg'>" +
    "<path d='M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z' fill='" + color + "' stroke='#fff' stroke-width='1'/>" +
    "<circle cx='12' cy='12' r='5' fill='#fff'/>" +
    "</svg>";
  return L.divIcon({
    html: svg,
    className: "",
    iconSize: [26, 34],
    iconAnchor: [13, 34],
    popupAnchor: [0, -30]
  });
}

function dibujarMarcadores() {
  const postes = obtenerPostes();
  postes.forEach(function(p) {
    const marcador = L.marker([p.lat, p.lng], {
      icon: crearIconoGota(COLORES[p.tipo])
    }).addTo(mapa).bindPopup(contenidoPopup(p));
    capasMarcadores.push(marcador);
  });
}

function limpiarCapasMarcadores() {
  capasMarcadores.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
  capasMarcadores = [];
}

function actualizarContador() {
  const postes = obtenerPostes();
  const conteo = { clesa_sin_lampara: 0, clesa_con_lampara: 0, fuera_norma: 0, privado: 0 };
  postes.forEach(function(p) { conteo[p.tipo]++; });

  const contenedor = document.getElementById('contador');
  contenedor.innerHTML = "";
  Object.keys(NOMBRES).forEach(function(tipo) {
    const item = document.createElement('div');
    item.className = "contador-item";
    item.innerHTML =
      '<span class="bolita" style="background:' + COLORES[tipo] + '"></span>' +
      NOMBRES[tipo] + ": " + conteo[tipo];
    contenedor.appendChild(item);
  });
}

function leerArchivoComoBase64(archivo) {
  return new Promise(function(resolve, reject) {
    const lector = new FileReader();
    lector.onload = function() { resolve(lector.result); };
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

function limpiarFormulario() {
  coordenadaActual = null;
  document.getElementById('coordActual').innerText = "Coordenada: sin capturar";
  document.getElementById('potencia').value = "";
  document.getElementById('tipoLampara').value = "";
  document.getElementById('veinticuatroH').checked = false;
  document.getElementById('observaciones').value = "";
  document.getElementById('foto').value = "";
  posteEnEdicion = null;
  document.getElementById('btnGuardar').innerText = "Guardar poste";
}

function editarPosteDesdeMapa(id) {
  const postes = obtenerPostes();
  const poste = postes.find(function(p) { return p.id === id; });
  if (!poste) {
    return;
  }
  posteEnEdicion = id;
  coordenadaActual = { lat: poste.lat, lng: poste.lng, manual: poste.manual };
  document.getElementById('coordActual').innerText =
    "Editando poste. Coordenada actual: " + poste.lat.toFixed(6) + ", " + poste.lng.toFixed(6) +
    " (toca el mapa o usa GPS solo si quieres cambiarla)";
  document.getElementById('municipio').value = poste.municipio || "";
  document.getElementById('tipoPoste').value = poste.tipo;
  document.getElementById('tipoPoste').dispatchEvent(new Event('change'));
  document.getElementById('potencia').value = poste.potencia || "";
  document.getElementById('tipoLampara').value = poste.tipoLampara || "";
  document.getElementById('veinticuatroH').checked = !!poste.veinticuatroH;
  document.getElementById('observaciones').value = poste.observaciones || "";
  document.getElementById('btnGuardar').innerText = "Guardar cambios";
  mapa.closePopup();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btnGuardar').addEventListener('click', async function() {
  if (!coordenadaActual) {
    alert("Primero captura la coordenada del poste");
    return;
  }

  const municipio = document.getElementById('municipio').value;
  if (!municipio) {
    alert("Selecciona el municipio antes de guardar");
    return;
  }

  const tipoSeleccionado = document.getElementById('tipoPoste').value;
  const tipoLampara = document.getElementById('tipoLampara').value.trim();
  const potenciaValor = document.getElementById('potencia').value.trim();
  if (tipoSeleccionado !== "clesa_sin_lampara" && tipoLampara === "") {
    alert("Este tipo de poste lleva lampara, indica el tipo de lampara antes de guardar");
    return;
  }
  if (tipoSeleccionado !== "clesa_sin_lampara" && potenciaValor === "") {
    alert("Este tipo de poste lleva lampara, indica la potencia antes de guardar");
    return;
  }

  const archivoFoto = document.getElementById('foto').files[0];
  let fotoBase64 = null;
  if (archivoFoto) {
    fotoBase64 = await leerArchivoComoBase64(archivoFoto);
  }

  const postes = obtenerPostes();

  if (posteEnEdicion) {
    const indice = postes.findIndex(function(p) { return p.id === posteEnEdicion; });
    if (indice === -1) {
      alert("No se encontro el poste a editar");
      limpiarFormulario();
      return;
    }
    const original = postes[indice];
    postes[indice] = {
      id: original.id,
      fecha: original.fecha,
      hora: original.hora,
      municipio: municipio,
      lat: coordenadaActual.lat,
      lng: coordenadaActual.lng,
      manual: coordenadaActual.manual,
      tipo: tipoSeleccionado,
      potencia: document.getElementById('potencia').value,
      tipoLampara: tipoLampara,
      veinticuatroH: document.getElementById('veinticuatroH').checked,
      observaciones: document.getElementById('observaciones').value,
      foto: fotoBase64 || original.foto,
      sincronizado: false
    };
    guardarPostes(postes);

    limpiarCapasMarcadores();
    dibujarMarcadores();
    actualizarContador();
    actualizarEstadoSync();
    dibujarListaPostes();

    intentarSincronizarAutomatico(original.id, true);

    limpiarFormulario();
    return;
  }

  const poste = {
    id: Date.now(),
    fecha: new Date().toLocaleDateString(),
    hora: new Date().toLocaleTimeString(),
    municipio: municipio,
    lat: coordenadaActual.lat,
    lng: coordenadaActual.lng,
    manual: coordenadaActual.manual,
    tipo: tipoSeleccionado,
    potencia: document.getElementById('potencia').value,
    tipoLampara: tipoLampara,
    veinticuatroH: document.getElementById('veinticuatroH').checked,
    observaciones: document.getElementById('observaciones').value,
    foto: fotoBase64,
    sincronizado: false
  };

  postes.push(poste);
  guardarPostes(postes);
  actualizarEstadoSync();

  intentarSincronizarAutomatico(poste.id);

  const marcadorNuevo = L.marker([poste.lat, poste.lng], {
    icon: crearIconoGota(COLORES[poste.tipo])
  }).addTo(mapa).bindPopup(contenidoPopup(poste));
  capasMarcadores.push(marcadorNuevo);

  actualizarContador();
  limpiarFormulario();
});

function actualizarEstadoSync() {
  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });
  document.getElementById('estadoSync').innerText = "Pendientes por sincronizar: " + pendientes.length;
}

async function enviarPoste(poste) {
  const respuesta = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(poste)
  });
  const texto = await respuesta.text();
  let resultado;
  try {
    resultado = JSON.parse(texto);
  } catch (errorParseo) {
    window.ultimoErrorSync = "Respuesta no es JSON, status " + respuesta.status + ": " + texto.substring(0, 300);
    return false;
  }
  if (!resultado.ok) {
    window.ultimoErrorSync = resultado.error;
  }
  return resultado.ok;
}

async function intentarSincronizarAutomatico(idPoste, mostrarAlerta) {
  if (!navigator.onLine) {
    if (mostrarAlerta) {
      alert("No hay señal en este momento, el cambio queda pendiente de sincronizar.");
    }
    return;
  }

  const postes = obtenerPostes();
  const poste = postes.find(function(p) { return p.id === idPoste; });
  if (!poste || poste.sincronizado) {
    return;
  }

  document.getElementById('estadoSync').innerText = "Enviando poste recien guardado...";

  try {
    const ok = await enviarPoste(poste);
    if (ok) {
      poste.sincronizado = true;
      guardarPostes(postes);
      dibujarListaPostes();
      if (mostrarAlerta) {
        alert("Cambio enviado a la hoja de Sheets correctamente");
      }
    } else if (mostrarAlerta) {
      alert("No se pudo enviar el cambio a la hoja: " + window.ultimoErrorSync);
    }
  } catch (error) {
    console.log("No se pudo sincronizar automaticamente: " + error.message);
    if (mostrarAlerta) {
      alert("No se pudo enviar el cambio a la hoja: " + error.message);
    }
  }

  actualizarEstadoSync();
}

async function sincronizarPendientes(mostrarAlertas) {
  if (!navigator.onLine) {
    if (mostrarAlertas) {
      alert("No hay conexion en este momento, intenta cuando tengas senal");
    }
    return;
  }

  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });

  if (pendientes.length === 0) {
    if (mostrarAlertas) {
      alert("No hay postes pendientes por sincronizar");
    }
    return;
  }

  const boton = document.getElementById('btnSincronizar');
  boton.innerText = "Sincronizando...";
  boton.disabled = true;

  let enviados = 0;

  for (const poste of pendientes) {
    try {
      const ok = await enviarPoste(poste);
      if (ok) {
        poste.sincronizado = true;
        enviados++;
      }
    } catch (error) {
      window.ultimoErrorSync = "Fallo de red: " + error.message;
      console.log("Error enviando poste " + poste.id, error);
    }
  }

  guardarPostes(postes);
  actualizarEstadoSync();
  dibujarListaPostes();

  boton.innerText = "Sincronizar";
  boton.disabled = false;

  if (mostrarAlertas) {
    if (enviados < pendientes.length) {
      alert(enviados + " de " + pendientes.length + " postes sincronizados. Error: " + window.ultimoErrorSync);
    } else {
      alert(enviados + " de " + pendientes.length + " postes sincronizados");
    }
  }
}

document.getElementById('btnSincronizar').addEventListener('click', function() {
  sincronizarPendientes(true);
});

// Cuando el celular recupera senal, manda automaticamente todo lo pendiente
window.addEventListener('online', function() {
  sincronizarPendientes(false);
});

document.getElementById('btnNuevoMunicipio').addEventListener('click', function() {
  const postes = obtenerPostes();
  const pendientes = postes.filter(function(p) { return !p.sincronizado; });

  if (pendientes.length > 0) {
    const continuar = confirm(

      "Se recomienda sincronizar antes de continuar. " +
      "Si continuas, esos postes sin sincronizar se mantienen guardados, solo se limpia el mapa. Continuar?"
    );
    if (!continuar) {
      return;
    }
  } else {

    }
  }

  const soloPendientes = postes.filter(function(p) { return !p.sincronizado; });

document.getElementById('btnVerLista').addEventListener('click', function() {
  const contenedor = document.getElementById('listaPostes');
  if (contenedor.style.display === "none") {
    dibujarListaPostes();
    contenedor.style.display = "block";
    this.innerText = "Ocultar postes guardados";
  } else {
    contenedor.style.display = "none";
    this.innerText = "Ver postes guardados";
  }
});

function dibujarListaPostes() {
  const postes = obtenerPostes();
  const contenedor = document.getElementById('listaPostes');
  contenedor.innerHTML = "";

  if (postes.length === 0) {
    contenedor.innerHTML = "<div style='font-size:13px; color:#666;'>No hay postes guardados todavia</div>";
    return;
  }

  postes.slice().reverse().forEach(function(p) {
    const tarjeta = document.createElement('div');
    tarjeta.className = "tarjetaPoste";
    tarjeta.style.borderLeftColor = COLORES[p.tipo];
    tarjeta.innerHTML =
      "<div class='fila'>" +
        "<div>" +
          "<strong>" + NOMBRES[p.tipo] + "</strong><br>" +
          (p.municipio || "Sin municipio") + " - " + p.fecha + " " + p.hora + "<br>" +
          (p.sincronizado ? "Sincronizado" : "Pendiente") +
        "</div>" +
        "<div class='botones'>" +
          "<button class='btnEditarPoste' data-id='" + p.id + "'>Editar</button>" +
          "<button class='btnBorrarPoste' data-id='" + p.id + "'>Borrar</button>" +
        "</div>" +
      "</div>";
    contenedor.appendChild(tarjeta);
  });

  contenedor.querySelectorAll('.btnBorrarPoste').forEach(function(boton) {
    boton.addEventListener('click', function() {
      borrarPoste(Number(this.getAttribute('data-id')));
    });
  });

  contenedor.querySelectorAll('.btnEditarPoste').forEach(function(boton) {
    boton.addEventListener('click', function() {
      editarPosteDesdeMapa(Number(this.getAttribute('data-id')));
    });
  });
}

async function borrarPoste(id) {
  const postes = obtenerPostes();
  const poste = postes.find(function(p) { return p.id === id; });
  if (!poste) {
    return;
  }

  const confirmar = confirm("Seguro que quieres borrar este poste? Esta accion no se puede deshacer.");
  if (!confirmar) {
    return;
  }

  if (poste.sincronizado) {
    if (!navigator.onLine) {
      alert("Este poste ya esta en tu hoja de Sheets. Necesitas señal para borrarlo tambien alla.");
      return;
    }
    try {
      const respuesta = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ accion: "borrar", id: poste.id })
      });
      const texto = await respuesta.text();
      const resultado = JSON.parse(texto);
      if (!resultado.ok) {
        alert("No se pudo borrar en la hoja: " + resultado.error);
        return;
      }
      if (!resultado.borrado) {
        alert("Aviso: en tu celular se borro, pero la hoja no encontro ese ID (" + resultado.idBuscado + "). Revisa la hoja manualmente.");
      } else {
        alert("Borrado tambien en la hoja de Sheets");
      }
    } catch (error) {
      alert("No se pudo borrar en la hoja: " + error.message);
      return;
    }
  }

  const restantes = postes.filter(function(p) { return p.id !== id; });
  guardarPostes(restantes);

  limpiarCapasMarcadores();
  dibujarMarcadores();
  actualizarContador();
  actualizarEstadoSync();
  dibujarListaPostes();
}

// ---- Guia KML de referencia (no se guarda, solo se muestra) ----
let capasGuiaKml = [];
let kmlVisible = false;

document.getElementById('archivoKml').addEventListener('change', async function() {
  const archivo = this.files[0];
  if (!archivo) {
    return;
  }

  document.getElementById('estadoKml').innerText = "Leyendo archivo KML...";

  const texto = await archivo.text();
  const parser = new DOMParser();
  const xml = parser.parseFromString(texto, "application/xml");
  const placemarks = xml.getElementsByTagName("Placemark");

  limpiarCapasKml();

  let cargados = 0;
  for (let i = 0; i < placemarks.length; i++) {
    const puntos = placemarks[i].getElementsByTagName("coordinates");
    if (puntos.length === 0) {
      continue;
    }
    const texto = puntos[0].textContent.trim();
    const partes = texto.split(",");
    const lon = parseFloat(partes[0]);
    const lat = parseFloat(partes[1]);
    if (isNaN(lat) || isNaN(lon)) {
      continue;
    }
    const marcador = L.circleMarker([lat, lon], {
      radius: 5,
      color: "#000",
      fillColor: "#999",
      weight: 1,
      fillOpacity: 0.8
    }).bindPopup("Punto de guia (KML)");
    capasGuiaKml.push(marcador);
    cargados++;
  }

  document.getElementById('estadoKml').innerText = cargados + " puntos de guia cargados. Usa el boton para mostrarlos u ocultarlos.";

  if (!kmlVisible) {
    kmlVisible = true;
    document.getElementById('btnToggleKml').innerText = "Ocultar guia KML";
    mostrarCapasKml();
  }
});

function mostrarCapasKml() {
  capasGuiaKml.forEach(function(marcador) {
    marcador.addTo(mapa);
  });
}

function limpiarCapasKml() {
  capasGuiaKml.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
  capasGuiaKml = [];
}

document.getElementById('btnToggleKml').addEventListener('click', function() {
  if (capasGuiaKml.length === 0) {
    alert("Primero carga un archivo KML");
    return;
  }
  if (kmlVisible) {
    limpiarCapasKmlSoloMapa();
    kmlVisible = false;
    this.innerText = "Mostrar guia KML";
  } else {
    mostrarCapasKml();
    kmlVisible = true;
    this.innerText = "Ocultar guia KML";
  }
});

function limpiarCapasKmlSoloMapa() {
  capasGuiaKml.forEach(function(marcador) {
    mapa.removeLayer(marcador);
  });
}

// ---- Exportar los postes censados como KML ----
function escaparXml(texto) {
  if (texto === null || texto === undefined) {
    return "";
  }
  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

document.getElementById('btnExportarKml').addEventListener('click', function() {
  const postes = obtenerPostes();

  if (postes.length === 0) {
    alert("No hay postes guardados para exportar");
    return;
  }

  let placemarks = "";
  postes.forEach(function(p) {
    const descripcion =
      "Municipio: " + escaparXml(p.municipio) + "\n" +
      "Tipo: " + escaparXml(NOMBRES[p.tipo]) + "\n" +
      "Tipo de lampara: " + escaparXml(p.tipoLampara) + "\n" +
      "Potencia: " + escaparXml(p.potencia) + "\n" +
      "24H: " + (p.veinticuatroH ? "Si" : "No") + "\n" +
      "Observaciones: " + escaparXml(p.observaciones) + "\n" +
      "Fecha: " + escaparXml(p.fecha) + " " + escaparXml(p.hora) + "\n" +
      "Sincronizado: " + (p.sincronizado ? "Si" : "No");

    placemarks +=
      "<Placemark>" +
      "<name>" + escaparXml(NOMBRES[p.tipo]) + "</name>" +
      "<description><![CDATA[" + descripcion + "]]></description>" +
      "<Point><coordinates>" + p.lng + "," + p.lat + ",0</coordinates></Point>" +
      "</Placemark>";
  });

  const kml =
    '<?xml version="1.0" encoding="UTF-8"?>' +
    '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>' +
    "<name>Censo de Postes</name>" +
    placemarks +
    "</Document></kml>";

  const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement('a');
  enlace.href = url;
  const fecha = new Date().toISOString().slice(0, 10);
  enlace.download = "censo_postes_" + fecha + ".kml";
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  URL.revokeObjectURL(url);
});

// ---- Descargar el mapa de la zona visible para usarlo sin señal ----
function long2tile(lon, zoom) {
  return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
}

function lat2tile(lat, zoom) {
  return Math.floor(
    (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom)
  );
}

document.getElementById('btnDescargarMapa').addEventListener('click', async function() {
  if (!navigator.onLine) {
    alert("Necesitas señal para descargar el mapa de esta zona");
    return;
  }

  const bounds = mapa.getBounds();
  const zooms = [14, 15, 16, 17];
  const listaTiles = [];

  zooms.forEach(function(z) {
    const x1 = long2tile(bounds.getWest(), z);
    const x2 = long2tile(bounds.getEast(), z);
    const y1 = lat2tile(bounds.getNorth(), z);
    const y2 = lat2tile(bounds.getSouth(), z);
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
        listaTiles.push({ z: z, x: x, y: y });
      }
    }
  });

  if (listaTiles.length > 4000) {
    const continuar = confirm(
      "Esta zona tiene " + listaTiles.length + " imagenes de mapa, puede tardar varios minutos y pesar bastante. " +
      "Si es mucha area, acerca mas el zoom antes de descargar. Continuar de todas formas?"
    );
    if (!continuar) {
      return;
    }
  }

  const boton = document.getElementById('btnDescargarMapa');
  boton.disabled = true;
  let hechos = 0;
  let nuevos = 0;

  for (const t of listaTiles) {
    const clave = t.z + '_' + t.x + '_' + t.y;
    const existente = await obtenerTileDB(clave);
    if (!existente) {
      try {
        const url = 'https://a.tile.openstreetmap.org/' + t.z + '/' + t.x + '/' + t.y + '.png';
        const resp = await fetch(url);
        if (resp.ok) {
          const blob = await resp.blob();
          await guardarTileDB(clave, blob);
          nuevos++;
        }
      } catch (error) {
        console.log("No se pudo descargar tile " + clave);
      }
    }
    hechos++;
    if (hechos % 15 === 0 || hechos === listaTiles.length) {
      document.getElementById('estadoMapaOffline').innerText =
        "Descargando: " + hechos + " de " + listaTiles.length;
    }
  }

  document.getElementById('estadoMapaOffline').innerText =
    "Listo. " + nuevos + " imagenes nuevas guardadas (" + listaTiles.length + " revisadas en total). Ya puedes usar esta zona sin señal.";
  boton.disabled = false;
});
